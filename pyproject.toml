[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wispr-hci-lab"
version = "0.1.0"
description = "Three open HCI experiments in speech-driven computer use: speculative voice-to-action, streaming disfluency patching, and VoiceHCI-Bench."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Real microphone + local streaming ASR (Project 1 / 2 live demos)
audio = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.26"]
# Native Windows accessibility + input injection
windows = ["uiautomation>=2.0", "pywin32>=306"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
voice-action = "voice_action.cli:main"
thought-stream = "thought_stream.cli:main"
voicehci-bench = "voicehci_bench.cli:main"

[tool.setuptools.packages.find]
include = ["hci_common*", "voice_action*", "thought_stream*", "voicehci_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.setuptools.package-data]
voicehci_bench = ["dashboard/*.html"]
